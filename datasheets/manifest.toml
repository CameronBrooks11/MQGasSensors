# Datasheets the coefficients in this repository were derived from.
#
# The PDFs are copyrighted and are not stored here. `just datasheets` downloads
# each one from the first mirror that returns exactly these bytes.
#
# Mirror kinds, in the order they are tried:
#   wayback  Internet Archive snapshot, raw-bytes form. Immutable.
#   swh      Software Heritage, addressed by the file's own SHA-256. Immutable.
#   live     A distributor or manufacturer URL. Can change or vanish.
#   github   A third-party repository's copy, pinned to a commit. Last resort.
#
# Two documents for the same sensor from different makers are different
# datasheets with different curves, never mirrors of each other.

