version: 2
updates:
  # The actions the Check and Datasheet mirrors workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The curve tracer's Python dependencies, locked in analysis/uv.lock.
  - package-ecosystem: uv
    directory: /analysis
    schedule:
      interval: monthly
    groups:
      analysis:
        patterns: ["*"]
    commit-message:
      prefix: build
