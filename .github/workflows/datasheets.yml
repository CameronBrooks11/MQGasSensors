name: Datasheet mirrors

# Tests every mirror of every datasheet in datasheets/manifest.toml, not only
# the first that works. Kept out of the pull request gate so that an archive
# having a bad day cannot fail unrelated changes; it runs on a pull request only
# when the manifest or the fetch script itself changes.
on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - datasheets/manifest.toml
      - scripts/datasheets.py
      - .github/workflows/datasheets.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Fails only when a datasheet has no working mirror left.
      - name: Verify every mirror
        run: |
          set -o pipefail
          python3 scripts/datasheets.py verify --retries 5 --backoff 10 | tee verify.log

      # A mirror that fails while another still works does not fail the run;
      # it is raised as a warning so it gets replaced before the last one goes.
      - name: Report
        if: always()
        run: |
          test -f verify.log || exit 0
          grep -E '^BAD' verify.log | while IFS= read -r line; do
            echo "::warning title=Datasheet mirror failing::$line"
          done
          {
            echo '### Datasheet mirrors'
            echo
            tail -n 1 verify.log
            echo
            echo '```'
            grep -E '^(BAD|DEAD)' verify.log || echo 'every mirror served the expected file'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
