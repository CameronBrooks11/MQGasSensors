name: Datasheet mirrors

# Two checks that need the real datasheets, kept out of the pull request gate so
# that an archive having a bad day cannot fail unrelated changes:
#
#   verify     tests every mirror of every datasheet in datasheets/manifest.toml,
#              not only the first that works
#   reproduce  downloads the datasheets and re-derives every traced or
#              extracted curve from them, expecting the committed points back
#              exactly
#
# Both run monthly, on demand, and on a pull request that changes what they
# depend on.
on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - datasheets/manifest.toml
      - scripts/datasheets.py
      - .github/workflows/datasheets.yml
      - analysis/curves.toml
      - analysis/recipes/**
      - analysis/points/**
      - analysis/mqcurves/**
      - analysis/uv.lock

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # A full pass took 23 minutes from a GitHub runner on 2026-11-13, and a few
    # minutes from a home line the same day. Why it is slower here is not known.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fails only when a datasheet has no working mirror left.
      - name: Verify every mirror
        run: |
          set -o pipefail
          python3 -u scripts/datasheets.py verify --retries 5 --backoff 10 | tee verify.log

      # A mirror that fails while another still works does not fail the run;
      # it is raised as a warning so it gets replaced before the last one goes.
      - name: Report
        if: always()
        run: |
          test -f verify.log || exit 0
          grep -E '^BAD' verify.log | while IFS= read -r line; do
            echo "::warning title=Datasheet mirror failing::$line"
          done
          {
            echo '### Datasheet mirrors'
            echo
            tail -n 1 verify.log
            echo
            echo '```'
            grep -E '^(BAD|DEAD)' verify.log || echo 'every mirror served the expected file'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      # Downloads each datasheet from its first working mirror, then traces every
      # curve whose points came from a recipe and compares them with the committed
      # points byte for byte.
      - name: Download the datasheets and re-derive
        run: just reproduce
