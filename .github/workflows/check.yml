name: Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    # Pinned: simavr comes from this release's apt archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: "1.40.0"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Setup (board cores and libraries)
        run: just setup

      - name: Check (compile every example)
        run: just check

      - name: Install simavr
        run: sudo apt-get update && sudo apt-get install -y simavr

      - name: Test (unit tests on a simulated Mega 2560)
        run: just test
