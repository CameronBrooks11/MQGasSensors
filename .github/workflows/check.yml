name: Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Setup (board cores and libraries)
        run: just setup

      - name: Check (compile every example)
        run: just check

      - name: Install simavr
        run: sudo apt-get update && sudo apt-get install -y simavr

      - name: Test (unit tests on a simulated Mega 2560)
        run: just test
