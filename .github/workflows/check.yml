name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned: simavr comes from this release's apt archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.40.0"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      - name: Setup (board cores and libraries)
        run: just setup

      - name: Check (assets, coefficients page, compile every example)
        run: just check

      - name: Install simavr
        run: sudo apt-get update && sudo apt-get install -y simavr

      - name: Test (library on a simulated Mega 2560, scripts, curve tracer)
        run: just test
