# Every curve with digitised points, and where the points came from.
#
# origin = "upstream": read by hand off the datasheet figure by the authors of
#   MQSensorsLib, a few marker positions per curve. Copied from
#   miguel5612/MQSensorsLib_Docs at commit 2faa17ac7ea0 (MIT), with decimal
#   commas normalised; `upstream_file` is the path there.
# origin = "traced": produced by `mqcurves trace` from the recipe named in `recipe`.
# origin = "extracted": produced by `mqcurves extract` from the recipe named in
#   `recipe`: the marker positions of a figure the PDF draws with vector commands.
# hand_read: for a curve re-derived from a datasheet that also has hand-read
#   points for the gas, the id of that hand-read curve. The two are compared on
#   the coefficients page.
#
# unit: the concentration unit of the figure's horizontal axis. "ppm" unless given.
# note: something a reader of the coefficients page should know about this curve.

